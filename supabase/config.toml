# Ces deux fonctions sont appelées par nos propres triggers Postgres (via
# pg_net), pas par un utilisateur connecté — elles n'ont donc pas de vrai
# JWT à présenter, seulement notre clé anon. Le contrôle verify_jwt de la
# plateforme (avant même que le code de la fonction ne s'exécute) les
# rejetait avec un 401. La vérification d'origine se fait déjà nous-mêmes
# via l'en-tête x-webhook-secret dans le code de chaque fonction.
[functions.discord-on-guild-created]
verify_jwt = false

[functions.discord-on-guild-join]
verify_jwt = false

# IMPORTANT (leçon apprise ce soir à la dure) : ce fichier seul ne suffit
# PAS toujours à désactiver verify_jwt — on a dû batailler des heures avant
# de comprendre que le vrai bug était ailleurs (secret mal synchronisé),
# mais on a aussi confirmé que le déploiement le plus fiable est TOUJOURS
# avec le drapeau explicite en CLI :
#   supabase functions deploy <nom> --use-api --no-verify-jwt
# Ne te fie jamais à ce fichier seul pour ces fonctions déclenchées par
# triggers (jamais par un vrai utilisateur connecté, donc jamais de JWT).
[functions.discord-notify-step-open]
verify_jwt = false

[functions.discord-notify-resolution-open]
verify_jwt = false

[functions.discord-notify-shield-open]
verify_jwt = false

[functions.discord-notify-expedition-summary]
verify_jwt = false

[functions.discord-notify-expedition-open]
verify_jwt = false